<!DOCTYPE html>
<html lang="es">
<body>
  <button id="conectar">Conectar</button>
  <button id="desconectar" disabled>Desconectar</button>
  <p>Estado: <span id="estado">Desconectado</span> | Bytes: <span id="count">0</span></p>
  <h2>Peso: <span id="peso">-</span></h2>
  <p>Última trama: <code id="trama">-</code></p>
  <pre id="log" style="background:#eee;padding:8px;min-height:150px"></pre>

<script>
const CONFIG = { baudRate: 9600, dataBits: 8, stopBits: 1, parity: 'none' };
const $ = id => document.getElementById(id);
let port, reader, keep = false, total = 0;

$('conectar').onclick = async () => {
  try {
    port = await navigator.serial.requestPort();
    await port.open(CONFIG);
    await port.setSignals({ dataTerminalReady: true, requestToSend: true });
    $('estado').textContent = 'Conectado';
    $('conectar').disabled = true;
    $('desconectar').disabled = false;
    leer();
  } catch (e) {
    $('estado').textContent = 'Error: ' + e.message;
  }
};

async function leer() {
  keep = true;
  let buffer = '';
  const dec = new TextDecoder();
  while (port.readable && keep) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        total += value.length;
        $('count').textContent = total;

        // Crudo: texto visible + HEX
        const hex = [...value].map(b => b.toString(16).padStart(2, '0')).join(' ');
        const vis = dec.decode(value, { stream: true })
          .replace(/\r/g, '\\r').replace(/\n/g, '\\n');
        $('log').textContent = `[${vis}]  ${hex}\n` + $('log').textContent.slice(0, 3000);

        // Interpretación por tramas (cualquier terminador)
        buffer += String.fromCharCode(...value);
        const partes = buffer.split(/\r\n|\r|\n/);
        buffer = partes.pop();
        partes.forEach(p => { if (p.trim()) procesar(p.trim()); });
      }
    } catch (e) {
      $('estado').textContent = 'Error lectura: ' + e.message;
    } finally {
      reader.releaseLock();
    }
  }
  await port.close();
  $('estado').textContent = 'Desconectado';
  $('conectar').disabled = false;
  $('desconectar').disabled = true;
}

function procesar(trama) {
  $('trama').textContent = trama;
  const m = trama.match(/-?\d+(?:\.\d+)?/); // primer número de la trama
  if (m) $('peso').textContent = m[0];
}

$('desconectar').onclick = async () => {
  keep = false;
  if (reader) await reader.cancel();
};
</script>
</body>
</html>

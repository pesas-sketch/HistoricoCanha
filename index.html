<!DOCTYPE html>
<html lang="es">
<body>
  <button id="conectar">Conectar</button>
  <button id="desconectar" disabled>Desconectar</button>
  <p>Estado: <span id="estado">Desconectado</span></p>
  <p>Última lectura: <strong id="lectura">-</strong></p>
  <pre id="log"></pre>

<script>
const CONFIG = { baudRate: 9600, dataBits: 8, stopBits: 1, parity: 'none' };
let port, reader, keepReading = false;

const $ = id => document.getElementById(id);

async function abrir(p) {
  port = p;
  await port.open(CONFIG);
  $('estado').textContent = 'Conectado';
  $('conectar').disabled = true;
  $('desconectar').disabled = false;
  leer();
}

async function leer() {
  keepReading = true;
  let buffer = '';
  const decoder = new TextDecoder();

  while (port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lineas = buffer.split(/\r?\n/);
        buffer = lineas.pop(); // fragmento incompleto
        lineas.forEach(l => { if (l.trim()) procesar(l.trim()); });
      }
    } catch (e) {
      console.error('Error de lectura:', e);
    } finally {
      reader.releaseLock();
    }
  }
  await port.close();
  $('estado').textContent = 'Desconectado';
  $('conectar').disabled = false;
  $('desconectar').disabled = true;
}

function procesar(linea) {
  $('lectura').textContent = linea;
  $('log').textContent = linea + '\n' + $('log').textContent.slice(0, 2000);
}

$('conectar').onclick = async () => {
  try {
    await abrir(await navigator.serial.requestPort());
  } catch (e) {
    $('estado').textContent = 'Error: ' + e.message;
  }
};

$('desconectar').onclick = async () => {
  keepReading = false;
  if (reader) await reader.cancel();
};

// Si el usuario desenchufa el convertidor
navigator.serial.addEventListener('disconnect', () => {
  keepReading = false;
  $('estado').textContent = 'Dispositivo desconectado';
});

// Reconexión automática si ya se autorizó antes
navigator.serial.getPorts().then(ports => {
  if (ports.length) abrir(ports[0]).catch(console.error);
});
</script>
</body>
</html>
